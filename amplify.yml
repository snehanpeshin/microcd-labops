version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_SERVICE_ROLE_KEY=|RESEND_|LEAD_NOTIFICATION_EMAIL=|EMAIL_PREVIEW_MODE=|CRON_SECRET=|OPENAI_|STRIPE_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
